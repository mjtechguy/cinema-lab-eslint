# pass `cinema run --commit HEAD <id>` and agree with CI before it counts for anything.
schema_version: 1
tasks:
  # ci.yml: pnpm_test
  # REVIEW: uses pnpm/action-setup: its tool version must be pinned and fingerprinted (toolchain:)
  # NOTE: Node "lts/*" resolved to 24.22.1, the newest matching release today: CI will move on; this pin won't
  pnpm-test:
    argv:
      - bash
      - -eo
      - pipefail
      - -c
      - |-
        (
        npm run test:pnpm
        )
    platform: linux/amd64
    runtime:
      node: 24.22.1
    toolchain:
      - cmd: [node, --version]
    cpus: 4
    timeout: 60m
    reuse:
      allowed: true
      max_age: 24h
