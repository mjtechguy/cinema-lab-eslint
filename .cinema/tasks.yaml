  # ecosystem-tests.yml: test_ecosystem (plugin=@eslint/css)
  # REVIEW: a step is conditional (if: steps.get_pm.outputs.pm == 'pnpm'); it is included unconditionally
  # REVIEW: a step fetches a floating version (@latest / HEAD / master): results can change without a source change
  # NOTE: Node "lts/*" resolved to 24.22.1, the newest matching release today: CI will move on; this pin won't
  # NOTE: $GITHUB_ENV, $GITHUB_PATH and $GITHUB_OUTPUT are emulated with temp files, loaded before each step
  test-ecosystem-eslint-css:
    argv:
      - bash
      - -eo
      - pipefail
      - -c
      - |-
        export GITHUB_ENV=$(mktemp) GITHUB_PATH=$(mktemp) GITHUB_OUTPUT=$(mktemp) GITHUB_STEP_SUMMARY=/dev/null
        trap 'rm -f "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT"' EXIT
        _gh_load() {
          local l n d v x p
          while IFS= read -r l; do
            n=${l%%=*}
            if [[ $n == *'<<'* ]]; then
              n=${l%%<<*} d=${l#*<<} v=
              while IFS= read -r x && [[ $x != "$d" ]]; do v+=${v:+$'\n'}$x; done
              export "$n=$v"
            elif [[ $l == *=* ]]; then
              export "$n=${l#*=}"
            fi
          done <"$GITHUB_ENV"
          while IFS= read -r p; do [[ -n $p ]] && PATH=$p:$PATH; done <"$GITHUB_PATH"
        }
        (
          _gh_load
        echo "pm=$(jq -r --arg plugin "@eslint/css" '.[$plugin].commands.install[0]' tools/test-ecosystem/plugins-data.json)" >> "$GITHUB_OUTPUT"
        )
        (
          _gh_load
        npm install -g corepack@latest
        corepack enable pnpm
        )
        (
          _gh_load
        npm install
        )
        (
          _gh_load
        npm run test:ecosystem -- --plugin @eslint/css
        )
    platform: linux/amd64
    runtime:
      node: 24.22.1
    toolchain:
      - cmd: [node, --version]
    cpus: 4
    timeout: 60m
    reuse:
      allowed: true
      max_age: 24h
