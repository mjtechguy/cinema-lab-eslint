name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    cinema:
        runs-on: ubuntu-latest
        permissions: { contents: read }
        outputs:
            skip_pnpm_test: ${{ steps.verify.outputs.skip_pnpm_test }}
            skip_test_types: ${{ steps.verify.outputs.skip_test_types }}
            skip_verify_files: ${{ steps.verify.outputs.skip_verify_files }}
            exclude_test_on_node: ${{ steps.verify.outputs.exclude_test_on_node }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { fetch-depth: 0, persist-credentials: false }
            - name: install cinema
              env: { GH_TOKEN: "${{ github.token }}" }
              run: |
                  gh release download cinema-lab -R "$GITHUB_REPOSITORY" -p cinema-linux-amd64 -O "$RUNNER_TEMP/cinema"
                  chmod +x "$RUNNER_TEMP/cinema" && sudo mv "$RUNNER_TEMP/cinema" /usr/local/bin/cinema
            - id: verify
              name: skip jobs that already passed (signed cinema receipts)
              env:
                  CINEMA_TRUSTED_KEYS: "${{ vars.CINEMA_TRUSTED_KEYS }}"
                  CINEMA_FETCH_TOKEN: "${{ github.token }}"
              run: cinema verify --event "$GITHUB_EVENT_PATH" --skip-outputs ci.yml

    verify_files:
        needs: cinema
        if: ${{ !cancelled() && needs.cinema.outputs.skip_verify_files != 'true' }}
        name: Verify Files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version: "stable"
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Lint GitHub Actions workflows
              run: |
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
                  actionlint -color -shellcheck= -pyflakes=

            - name: Install Packages
              run: npm install

            - name: Install Docs Packages
              working-directory: docs
              run: npm install

            - name: Lint Files
              run: node Makefile lint

            - name: Check Rule Files
              run: node Makefile checkRuleFiles

            - name: Check Licenses
              run: node Makefile checkLicenses

            - name: Lint Docs JS Files
              run: node Makefile lintDocsJS

            - name: Check Rule Examples
              run: node Makefile checkRuleExamples

            - name: Check Rule Types
              run: npm run lint:rule-types

            - name: Lint Files, Dependencies, & Exports
              run: npm run lint:unused

            - name: Check Formatting
              run: npm run fmt:check

    test_on_node:
        needs: cinema
        if: ${{ !cancelled() }}
        name: Test
        strategy:
            matrix:
                exclude: ${{ fromJSON(needs.cinema.outputs.exclude_test_on_node || '[]') }}
                os: [ubuntu-latest]
                node: [26.x, 24.x, 22.x, 20.x, "20.19.0"]
                NODE_OPTIONS: [""]
                include:
                    - os: windows-latest
                      node: "lts/*"
                    - os: macOS-latest
                      node: "lts/*"
                    - os: ubuntu-latest
                      node: 24.x

                      # `--experimental-strip-types` is enabled by default in Node.js 24.x.
                      # This additional environment is necessary only to test `--experimental-transform-types`,
                      # as it is not enabled by default in any Node.js version yet.
                      NODE_OPTIONS: "--experimental-transform-types"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - name: Install Packages
              run: npm install
            - name: Test
              env:
                  NODE_OPTIONS: ${{ matrix.NODE_OPTIONS }}
              run: node Makefile mocha
            - name: Fuzz Test
              run: node Makefile fuzz
            - name: Test EMFILE Handling
              run: npm run test:emfile

    test_on_browser:
        name: Browser Test
        runs-on: ubuntu-latest
        env:
            TERM: xterm-256color
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24" # Should be the same as the version used on Netlify to build the ESLint Playground

            # Node 24.18.0 bundles npm 11.16.0, which has a bug where denying a package's
            # install scripts via `allowScripts` also drops its `.bin` links.
            # Fixed in npm 11.18.0. See https://github.com/npm/cli/issues/9681
            - name: Update npm
              run: npm install -g npm@latest
            - name: Install Packages
              run: npm install
            - name: Test
              run: node Makefile cypress
            - name: Fuzz Test
              run: node Makefile fuzz

    test_types:
        needs: cinema
        if: ${{ !cancelled() && needs.cinema.outputs.skip_test_types != 'true' }}
        name: Test Types
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
            - name: Install Packages
              run: npm install

            - name: Test types (eslint)
              run: npx tsc -p tests/lib/types/tsconfig.json

            - name: Test types (eslint-config-eslint)
              run: npm run test:types -w packages/eslint-config-eslint

            - name: Test types (@eslint/js)
              run: npm run test:types -w packages/js

            - name: Check types compile (TypeScript 5.3)
              run: npm run test:types:5.3

            - name: Check types compile (TypeScript 5.x)
              run: npm run test:types:5.x

            - name: Check types compile (TypeScript 7 preview)
              run: npm run test:types:7.x

    test_package_manager:
        name: Test Package Managers
        uses: eslint/workflows/.github/workflows/ci-package-manager.yml@main

    pnpm_test:
        needs: cinema
        if: ${{ !cancelled() && needs.cinema.outputs.skip_pnpm_test != 'true' }}
        name: Test pnpm Type Support
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: latest

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Run pnpm test
              run: npm run test:pnpm
