name: Docs CI
on:
    push:
        branches: [main]
        paths:
            - "docs/**"

    pull_request:
        branches: [main]
        paths:
            - "docs/**"

permissions:
    contents: read

jobs:
    cinema:
        runs-on: ubuntu-latest
        permissions: { contents: read }
        outputs:
            skip_verify_files: ${{ steps.verify.outputs.skip_verify_files }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { fetch-depth: 0, persist-credentials: false }
            - name: install cinema
              env: { GH_TOKEN: "${{ github.token }}" }
              run: |
                  gh release download cinema-lab -R "$GITHUB_REPOSITORY" -p cinema-linux-amd64 -O "$RUNNER_TEMP/cinema"
                  chmod +x "$RUNNER_TEMP/cinema" && sudo mv "$RUNNER_TEMP/cinema" /usr/local/bin/cinema
            - id: verify
              name: skip jobs that already passed (signed cinema receipts)
              env:
                  CINEMA_TRUSTED_KEYS: "${{ vars.CINEMA_TRUSTED_KEYS }}"
                  CINEMA_FETCH_TOKEN: "${{ github.token }}"
              run: cinema verify --event "$GITHUB_EVENT_PATH" --skip-outputs docs-ci.yml

    verify_files:
        needs: cinema
        if: ${{ !cancelled() && needs.cinema.outputs.skip_verify_files != 'true' }}
        name: Verify Docs Files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24" # Should be the same as the version used on Netlify to build the docs site

            - name: Install Docs Packages
              working-directory: docs
              run: npm install

            - name: Install Packages
              run: npm install

            - name: Stylelint Docs
              working-directory: docs
              run: npm run lint:scss

            - name: Build Docs Website
              working-directory: docs
              run: npm run build

            - name: Validate internal links
              working-directory: docs
              run: npm run lint:links
